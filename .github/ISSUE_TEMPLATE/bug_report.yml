name: 'Bug Report'
description: 'Report a bug to help us improve geo-agent'
labels: ['status/need-triage', 'type/bug']
body:
  - type: 'markdown'
    attributes:
      value: |-
        > [!IMPORTANT]
        > Thanks for taking the time to fill out this bug report!
        >
        > Please search **[existing issues](https://github.com/shogoorg/geo-agent/issues)** to see if an issue already exists for the bug you encountered.

  - type: 'dropdown'
    id: 'component'
    attributes:
      label: 'Component'
      description: 'Which part of the project is affected?'
      options:
        - 'Backend (FastAPI / Agent / Python)'
        - 'Frontend (React / Web UI)'
        - 'Other'
    validations:
      required: true

  - type: 'textarea'
    id: 'problem'
    attributes:
      label: 'What happened?'
      description: 'A clear and concise description of what the bug is.'
    validations:
      required: true

  - type: 'textarea'
    id: 'repro'
    attributes:
      label: 'Steps to Reproduce'
      description: 'Please provide the exact steps to reproduce the behavior.'
      placeholder: |-
        1. Run backend with `uv run python -m app.fast_api_app`
        2. Open the web UI at `http://localhost:5173`
        3. Send a prompt `...`
        4. See error `...`
    validations:
      required: true

  - type: 'textarea'
    id: 'expected'
    attributes:
      label: 'What did you expect to happen?'
    validations:
      required: true

  - type: 'textarea'
    id: 'environment'
    attributes:
      label: 'Environment'
      description: 'Please provide your environment details (OS, Python/uv version, Node.js version, browser, etc.).'
      placeholder: |-
        - OS: [e.g. Ubuntu 24.04 / macOS 14 / Windows 11]
        - Python version: [e.g. 3.11]
        - uv version: [e.g. 0.5.x]
        - Node.js version (if frontend): [e.g. v20.x]
        - Browser (if frontend): [e.g. Chrome 120]
    validations:
      required: false

  - type: 'textarea'
    id: 'logs'
    attributes:
      label: 'Command Output / Logs / Console Output'
      description: 'Paste any relevant terminal or browser console logs here.'
    validations:
      required: false

  - type: 'textarea'
    id: 'additional-context'
    attributes:
      label: 'Anything else we need to know?'
      description: 'Add any other context, screenshots, or information here.'
