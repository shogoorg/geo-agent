[project]
name = "geo-agent"
version = "0.1.0"
description = ""
authors = [
    {name = "Your Name", email = "your@email.com"},
]


dependencies = [
    "google-adk[bigquery-analytics,gcp,otel-gcp]>=2.8.0,<2.9.0",
    "opentelemetry-resourcedetector-gcp<=1.12.0a0",
    "gcsfs>=2024.11.0",
    "a2a-sdk[http-server]>=0.3.0,<2",
    "aiohttp>=3.13.4",
    "google-cloud-logging>=3.12.0,<4.0.0",
    "asyncpg>=0.30.0,<1.0.0",
    "fastapi>=0.115.8,<1.0.0",
    "google-cloud-aiplatform[evaluation]>=1.156.0,<2.0.0",
    "python-multipart>=0.0.20,<1.0.0",
    "sqlalchemy>=2,<3",
    "uvicorn~=0.34.0",
    # Difference from base ADK scaffold (agents-cli create --bq-analytics):
    # Dependencies added for Google Maps Agentic UI (A2UI), MCP, and BigQuery Storage:
    "maui-a2ui-python",
    "a2ui-agent-sdk>=0.2.4",
    "jsonschema>=4.0.0",
    "mcp>=1.2.0,<2.0.0",
    "pyarrow>=25.0.1",
    "google-cloud-bigquery-storage>=2.41.0",
]
requires-python = ">=3.12,<3.14"


[dependency-groups]
dev = [
    "pytest>=9.0.2,<10.0.0",
    "pytest-asyncio>=1.0.0,<2.0.0",
    "nest-asyncio>=1.6.0,<2.0.0",
]

[project.optional-dependencies]
eval = [
    "google-adk[eval]>=2.6.0,<3.0.0",
    "google-cloud-aiplatform[evaluation]>=1.156.0,<2.0.0"
]
lint = [
    "ruff>=0.4.6,<1.0.0",
    "ty>=0.0.1a0",
    "codespell>=2.2.0,<3.0.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "C",  # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP", # pyupgrade
    "RUF", # ruff specific rules
]
ignore = ["E501", "C901", "B006"] # ignore line too long, too complex

[tool.ruff.lint.isort]
known-first-party = ["app", "frontend"]

[tool.ty]
# ty is Astral's Rust-based type checker (same team as ruff/uv)
# See: https://docs.astral.sh/ty/

[tool.ty.environment]
python-version = "3.10"

[tool.ty.src]
exclude = [".venv/**"]

[tool.ty.rules]
# Ignore common issues with third-party libraries and dynamic code patterns
unresolved-import = "ignore"
unresolved-attribute = "ignore"
invalid-argument-type = "ignore"
invalid-assignment = "ignore"
invalid-return-type = "ignore"
possibly-missing-attribute = "ignore"
not-subscriptable = "ignore"
deprecated = "ignore"

[tool.codespell]
ignore-words-list = "rouge"
skip = "./locust_env/*,uv.lock,.venv,./frontend,**/package-lock.json"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.pytest.ini_options]
pythonpath = "."
asyncio_default_fixture_loop_scope = "session"

# Difference from base ADK scaffold (agents-cli create --bq-analytics):
# Upstream git source configuration for Google Maps A2UI Python agent package
[tool.uv.sources]
maui-a2ui-python = { git = "https://github.com/googlemaps/a2ui.git", tag = "v0.1.8", subdirectory = "agent/python_agent" }

[tool.hatch.build.targets.wheel]
packages = ["app","frontend"]


